# The image a visitor starts from. Tagging a release builds it for the two
# architectures self-hosters actually run and pushes it to ghcr.io, so that
# the first `docker compose up -d` is a download rather than PHP
# extensions, a Python virtualenv and a Tailwind pass compiled on a machine
# that may well be a Raspberry Pi.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Set per job rather than here, so neither job carries a permission the
# other one needs: the image job may write packages and cannot mint an
# OIDC token, the registry job the other way round. GITHUB_TOKEN carries
# whatever is granted and nothing else, which is also what limits the
# damage a compromised action in either chain could do.
permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner is amd64, so the arm64 half is built under emulation and
      # needs binfmt registered before buildx will accept the platform at
      # all. Paying for it here is what lets an Apple Silicon Mac, an ARM
      # VPS or a Raspberry Pi pull an image instead of building one.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      # The default docker driver builds one architecture at a time and has
      # nowhere to put a multi-arch manifest. buildx's container driver
      # writes both halves and the index over them, and is also the thing
      # the type=gha cache below talks to.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Minted for this run and void when it ends, so publishing needs
          # no secret kept in the repository.
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 ships as 1.2.3 and as 1.2, so an installation can follow a
      # minor line and still receive its patches. `latest` is left to the
      # default latest=auto, which sets it on a stable tag and withholds it
      # from a pre-release: v1.3.0-rc.1 is then reachable only by its own
      # full version, and nobody lands on a release candidate by pulling
      # the name they never chose.
      #
      # The branch line is what makes workflow_dispatch work. Started by
      # hand from main, the semver patterns match nothing, and a build with
      # an empty tag list has no name to push under.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/imgrund/hybridlog
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          flavor: latest=auto
          # The MCP registry takes this name as the proof that whoever
          # pushed the image also owns the server entry. The Dockerfile
          # already writes it into each platform's config; repeating it
          # here puts it on the multi-arch index as well, so the check
          # finds it whichever of the two it reads.
          #
          # What is set here wins over the Dockerfile's LABEL, so the two
          # spellings have to agree, capital I included: the namespace
          # follows the GitHub account and the registry compares it
          # case-sensitively. ServerManifestTest holds all four places to
          # the same string, because the last time they drifted the build
          # was green and the publish was refused.
          labels: |
            io.modelcontextprotocol.server.name=io.github.Imgrund/hybridlog
          annotations: |
            io.modelcontextprotocol.server.name=io.github.Imgrund/hybridlog

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Labels live in an image's config, and a multi-arch manifest has
          # no config of its own. The annotations carry the same statement
          # on the index itself, which is where ghcr.io reads the source
          # repository from to link the package back to this one.
          annotations: ${{ steps.meta.outputs.annotations }}
          # The emulated arm64 half is the slow part of this job, and from
          # nothing it repeats every apt, npm and pip step of the build.
          # mode=max keeps the intermediate stages too, so a release that
          # only touched PHP reuses the Node and Python layers instead of
          # resolving them again under emulation.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Listing the server in the official MCP registry used to be a hand step
  # after the tag, and a hand step after the tag is one that gets skipped:
  # 0.1.4 shipped its image and left the registry describing 0.1.3. This
  # job is that step, run by the same event that builds the image.
  registry:
    runs-on: ubuntu-latest
    needs: image
    # Only a real tag. Started by hand from a branch, server.json carries
    # whatever version main is on, and publishing that would announce a
    # release nobody cut.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      # The whole point of github-oidc: the runner mints a short-lived
      # token the registry verifies against this repository, so ownership
      # is proven without a secret living here.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned rather than latest, so a release of the publisher cannot
      # change what a tag of this repository does.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher --version
        env:
          PUBLISHER_VERSION: 1.8.1

      # ServerManifestTest holds server.json against the image tag it
      # names, which catches the two drifting apart but not both of them
      # lagging the tag being released. Without this, a release whose
      # version bump was forgotten publishes the previous version's
      # manifest under a green build.
      - name: The manifest must describe the tag being released
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME wants server.json version $want, found $have"
            exit 1
          fi

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
